<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #5b6573; --accent: #1f7a4d; --line: #e2e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a2129; --text: #e6eaef; --muted: #9aa6b2; --accent: #5cc98f; --line: #2a333d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  html[lang="fa"] body { font-family: Vazirmatn, Tahoma, sans-serif; }
  main { max-width: 760px; margin: 24px auto; padding: 28px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  @media (max-width: 800px) { main { margin: 0; border-radius: 0; border-left: 0; border-right: 0; padding: 20px 16px; } }
  h1 { font-size: 1.7rem; line-height: 1.3; margin-top: 0; }
  h2 { font-size: 1.2rem; margin-top: 2em; padding-top: .6em; border-top: 1px solid var(--line); }
  a { color: var(--accent); }
  code { font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  footer { max-width: 760px; margin: 0 auto 32px; padding: 0 24px; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
{{ content }}
</main>
<footer>
  {% if page.other_url %}<a href="{{ page.other_url | relative_url }}">{{ page.other_label }}</a> · {% endif %}TPG Studio · <a href="mailto:neshatvarjavand@gmail.com">neshatvarjavand@gmail.com</a>
</footer>
</body>
</html>
